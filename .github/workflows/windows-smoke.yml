name: Windows smoke test

# Builds the Windows installer, installs it on a GitHub Windows machine and drives the real app with made-up data:
# install, start, import, copy to the real clipboard, restart and hard kill keep the data. Screenshots, logs and
# the result table are uploaded as an artifact. It runs by hand, or on main every 5th preview version (owner
# 2026-10-20). It never publishes anything.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: windows-smoke-${{ github.ref }}
  # A later merge must not stop the 5th-version run on main.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Owner 2026-10-20: on main this runs only every 5th preview version (scripts/ci-due.mjs); by hand it always runs.
  due:
    name: every 5th version
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: due
        run: node scripts/ci-due.mjs
        env:
          EVENT: ${{ github.event_name }}

  smoke:
    needs: due
    if: needs.due.outputs.run == 'true'
    name: Windows smoke
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri:frontend
      - run: node scripts/sync-version.mjs
      - run: npx tauri build -- --features test-hooks
        env:
          CI: "true"
      - name: Install and drive the app
        shell: pwsh
        env:
          SMOKE_OUT: smoke-out
          SMOKE_UI: "1"
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          node tests/windows-smoke/smoke.mjs $installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-results
          path: smoke-out
          retention-days: 14
