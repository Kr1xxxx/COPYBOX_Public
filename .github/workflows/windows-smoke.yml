name: Windows smoke test

# Builds the Windows installer, installs it on a GitHub Windows machine and drives the real app with made-up data:
# install, start, import, copy to the real clipboard, restart and hard kill keep the data. Screenshots, logs and
# the result table are uploaded as an artifact. It only runs by hand, or when Tauri code or this test changes,
# so ordinary pull requests are not slowed down. It never publishes anything.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "tests/windows-smoke/**"
      - ".github/workflows/windows-smoke.yml"

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows smoke
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri:frontend
      - run: node scripts/sync-version.mjs
      - run: npx tauri build -- --features test-hooks
        env:
          CI: "true"
      - name: Install and drive the app
        shell: pwsh
        env:
          SMOKE_OUT: smoke-out
          SMOKE_UI: "1"
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          node tests/windows-smoke/smoke.mjs $installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-results
          path: smoke-out
          retention-days: 14
