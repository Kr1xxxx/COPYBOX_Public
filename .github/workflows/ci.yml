name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

# A new push to the same PR stops the older, now-outdated run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Owner 2026-10-20: on main this runs only when VERSION crosses a 0.05 step (scripts/ci-due.mjs, D-090); by hand it always runs.
  due:
    name: every 5th version
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: due
        run: node scripts/ci-due.mjs
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}

  check:
    name: lint + tests
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # The browser tests are split over four machines that run at the same time; together they still run every test.
  e2e-shard:
    name: browser end-to-end (${{ matrix.shard }}/4)
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The e2e suite only exists once the new UI (PR #1) is merged; skip it before that.
      - if: hashFiles('playwright.config.mjs') != ''
        run: npm ci
      - if: hashFiles('playwright.config.mjs') != ''
        run: npx playwright install --with-deps chromium
      - if: hashFiles('playwright.config.mjs') != ''
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # One check with the old name, green only when every part passed.
  e2e:
    name: browser end-to-end
    if: always() && needs.due.outputs.run == 'true'
    needs: [due, e2e-shard]
    runs-on: ubuntu-latest
    steps:
      - if: needs.e2e-shard.result != 'success'
        run: |
          echo "::error::A part of the browser tests failed: ${{ needs.e2e-shard.result }}"
          exit 1
      - run: echo "All four parts passed."

  # Not run since 2026-10-20 (CI no longer runs on pull requests); kept so PR runs can be switched back on.
  handoff:
    name: handoff updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Read labels now (not from the event) so a label added after opening still counts.
      - id: labels
        run: echo "json=$(gh pr view "$PR" --json labels --jq '[.labels[].name]')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - run: node scripts/check-handoff.mjs
        env:
          BASE_REF: origin/${{ github.base_ref }}
          LABELS: ${{ steps.labels.outputs.json }}
