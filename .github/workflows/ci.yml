name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: lint + tests
    runs-on: ubuntu-latest
    env:
      # Unit tests do not launch Electron, so skip the large binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: browser end-to-end
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The e2e suite only exists once the new UI (PR #1) is merged; skip it before that.
      - if: hashFiles('playwright.config.mjs') != ''
        run: npm ci
      - if: hashFiles('playwright.config.mjs') != ''
        run: npx playwright install --with-deps chromium
      - if: hashFiles('playwright.config.mjs') != ''
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  handoff:
    name: handoff updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Read labels now (not from the event) so a label added after opening still counts.
      - id: labels
        run: echo "json=$(gh pr view "$PR" --json labels --jq '[.labels[].name]')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - run: node scripts/check-handoff.mjs
        env:
          BASE_REF: origin/${{ github.base_ref }}
          LABELS: ${{ steps.labels.outputs.json }}

  # D-011: small changes merge themselves once every check is green; big ones wait for the owner.
  merge-policy:
    name: merge policy
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    needs: [check, e2e, handoff]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      # The commit these checks ran on. Merge only that commit, never a newer push that has not been checked yet.
      TESTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Read labels now (not from the event) so a "major" label added after opening still counts.
      - id: labels
        run: echo "json=$(gh pr view "$PR" --json labels --jq '[.labels[].name]')" >> "$GITHUB_OUTPUT"
      - id: size
        run: node scripts/classify-pr.mjs
        env:
          BASE_REF: origin/${{ github.base_ref }}
          LABELS: ${{ steps.labels.outputs.json }}
      - name: Small change → merge
        if: steps.size.outputs.size == 'small'
        run: |
          if [ "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" != "$TESTED_SHA" ]; then
            echo "::notice::A newer commit was pushed; its own checks decide the merge."
            exit 0
          fi
          gh pr edit "$PR" --remove-label needs-owner || true
          gh pr edit "$PR" --add-label auto-merged
          gh pr merge "$PR" --merge --delete-branch --match-head-commit "$TESTED_SHA"
      - name: Big change → wait for the owner
        if: steps.size.outputs.size == 'big'
        run: |
          gh pr edit "$PR" --add-label needs-owner
          echo "::notice::Waiting for the owner to say 合并 (merge)."
