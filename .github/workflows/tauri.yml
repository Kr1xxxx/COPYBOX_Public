name: Tauri build

# D-029: the desktop app is moving from Electron to Tauri. This only builds the Tauri shell on both platforms;
# it does not ship anything. The Electron app keeps shipping until the Tauri build reaches parity.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "src-tauri/**"
      - "scripts/tauri-frontend.mjs"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/tauri-frontend.mjs"

concurrency:
  group: tauri-${{ github.ref }}
  # Only pull requests cancel an older run; a build on main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost ten times as much as Linux. A pull request builds Windows only, plus the Mac build
        # once it carries the label `mac-check` (add it before merging a PR that touches Tauri code); main always builds both.
        include: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mac-check')) && '[{"name":"Windows","os":"windows-latest"},{"name":"macOS arm64","os":"macos-latest"}]' || '[{"name":"Windows","os":"windows-latest"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The shell embeds the saved page at compile time, so it has to exist before cargo test.
      - run: npm run tauri:frontend
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # The app version follows tools/preview/VERSION (D-036).
      - run: node scripts/sync-version.mjs
      - run: npx tauri build
        env:
          CI: "true"
      - name: Installer size
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.dmg' \) -exec ls -l {} \; | tee size.txt
          { echo '### Installer size'; echo '```'; cat size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: clipbox-tauri-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.app
          retention-days: 7
