name: Tauri build

# D-029: the desktop app is Tauri (Electron was removed in step 8). This only builds the Tauri shell on both platforms;
# it does not ship anything.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "src-tauri/**"
      - "scripts/tauri-frontend.mjs"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:
    inputs:
      publish_test_build:
        description: "Also publish both installers as a GitHub pre-release (a test build, not the update staff are offered)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/tauri-frontend.mjs"

concurrency:
  group: tauri-${{ github.ref }}
  # Only pull requests cancel an older run; a build on main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost ten times as much as Linux. A pull request builds Windows only, plus the Mac build
        # once it carries the label `mac-check` (add it before merging a PR that touches Tauri code); main always builds both.
        include: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mac-check')) && '[{"name":"Windows","os":"windows-latest"},{"name":"macOS arm64","os":"macos-latest"}]' || '[{"name":"Windows","os":"windows-latest"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The shell embeds the saved page at compile time, so it has to exist before cargo test.
      - run: npm run tauri:frontend
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # The app version follows tools/preview/VERSION (D-036).
      - run: node scripts/sync-version.mjs
      - run: npx tauri build
        env:
          CI: "true"
      - name: Installer size
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.dmg' \) -exec ls -l {} \; | tee size.txt
          { echo '### Installer size'; echo '```'; cat size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: clipbox-tauri-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.app
          retention-days: 7
      # A .app uploaded as an artifact loses its executable bits, so the Mac build is zipped with ditto first.
      - name: Name the test installers
        if: github.event_name == 'workflow_dispatch' && inputs.publish_test_build
        shell: bash
        run: |
          mkdir release-files
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe "release-files/Clipboxx-Tauri-test-Windows-setup.exe"
          else
            ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Clipboxx.app "release-files/Clipboxx-Tauri-test-macOS-arm64.zip"
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish_test_build
        with:
          name: release-${{ matrix.name }}
          path: release-files/*
          retention-days: 7

  test-release:
    name: publish test build
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_test_build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="tauri-test-${{ github.run_number }}"
          gh release create "$tag" release-files/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "Tauri 测试版 #${{ github.run_number }}(测试用,不是正式版)" \
            --notes "只用来测试的 Tauri 版本,不是员工收到的更新。Windows:下载 Setup.exe 运行(没有签名,Windows 会提示,选「仍要运行」)。Mac:解压后右键打开(没有签名)。装好后在旧版里「设置 → 数据 → 导出到新版」,再在这个版本里「从旧版导入」。提交 ${{ github.sha }}。"
          echo "https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
