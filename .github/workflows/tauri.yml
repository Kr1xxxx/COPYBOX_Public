name: Tauri build

# D-029: the desktop app is Tauri (Electron was removed in step 8). This only builds the Tauri shell on both platforms;
# it does not ship anything.
on:
  workflow_dispatch:
    inputs:
      publish_test_build:
        description: "Also publish both installers as a GitHub pre-release (a test build, not the update staff are offered)"
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: tauri-${{ github.ref }}
  # Only pull requests cancel an older run; a build on main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Owner 2026-10-20: on main this runs only every 5th preview version (scripts/ci-due.mjs); by hand it always runs.
  due:
    name: every 5th version
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: due
        run: node scripts/ci-due.mjs
        env:
          EVENT: ${{ github.event_name }}

  build:
    needs: due
    if: needs.due.outputs.run == 'true'
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost ten times as much as Linux. A pull request builds Windows only, plus the Mac build
        # once it carries the label `mac-check` (add it before merging a PR that touches Tauri code); main always builds both.
        include: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mac-check')) && '[{"name":"Windows","os":"windows-latest"},{"name":"macOS arm64","os":"macos-latest"}]' || '[{"name":"Windows","os":"windows-latest"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The shell embeds the saved page at compile time, so it has to exist before cargo test.
      - run: npm run tauri:frontend
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # The app version follows tools/preview/VERSION (D-036).
      - run: node scripts/sync-version.mjs
      - run: npx tauri build
        env:
          CI: "true"
      - name: Installer size
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.dmg' \) -exec ls -l {} \; | tee size.txt
          { echo '### Installer size'; echo '```'; cat size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: clipbox-tauri-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.app
          retention-days: 7
      # A .app uploaded as an artifact loses its executable bits, so the Mac build is zipped with ditto first.
      # File names follow the product name (D-046), ASCII only (GitHub mangles Chinese asset names); the website picks
      # the newest tauri-test-N asset ending in -Windows-setup.exe (tools/website/build.mjs).
      # release-version.json (D-048) says which app version the installer carries (package.json after sync-version),
      # which preview number that is, and which branch and commit it came from; the website reads the version it
      # advertises from this file, never from its own checkout. Test builds are published from main only.
      - name: Name the test installers
        if: github.event_name == 'workflow_dispatch' && inputs.publish_test_build && github.ref == 'refs/heads/main'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          mkdir release-files
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe "release-files/Copyboxx-Windows-setup.exe"
          else
            ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Copyboxx.app "release-files/Copyboxx-macOS-arm64.zip"
          fi
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); fs.writeFileSync('release-files/release-version.json', JSON.stringify({ version: pkg.version, preview: fs.readFileSync('tools/preview/VERSION', 'utf8').trim(), ref: process.env.REF_NAME, commit: process.env.SHA }, null, 2) + '\n');"
          cat release-files/release-version.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish_test_build && github.ref == 'refs/heads/main'
        with:
          name: release-${{ matrix.name }}
          path: release-files/*
          retention-days: 7

  # D-048: a test build becomes a release (and so the website's installer) only when it was built from main.
  publish-skipped:
    name: test build not published
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_test_build && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::Test builds are published from main only (D-048); nothing was published from ${{ github.ref_name }}. The installers are still in this run's artifacts."

  test-release:
    name: publish test build
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_test_build && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="tauri-test-${{ github.run_number }}"
          gh release create "$tag" release-files/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "Copyboxx 测试版 #${{ github.run_number }}（测试用，不是正式版）" \
            --notes "只用来测试的版本,不是员工收到的更新。Windows:下载 Setup.exe 运行(没有签名,Windows 会提示,选「仍要运行」)。Mac:解压后右键打开(没有签名)。装好后在旧版里「设置 → 数据 → 导出到新版」,再在这个版本里「从旧版导入」。提交 ${{ github.sha }}。"
          echo "https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
