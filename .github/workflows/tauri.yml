name: Tauri build

# D-029: the desktop app is moving from Electron to Tauri. This only builds the Tauri shell on both platforms;
# it does not ship anything. The Electron app keeps shipping until the Tauri build reaches parity.
on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/tauri-frontend.mjs"
      - ".github/workflows/tauri.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/tauri-frontend.mjs"

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
        env:
          CI: "true"
      - name: Installer size
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.dmg' \) -exec ls -l {} \; | tee size.txt
          { echo '### Installer size'; echo '```'; cat size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: clipbox-tauri-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.app
          retention-days: 7
