<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找不到这个页面 · Clipboxx</title>
<style>
  :root { --ground: #e9e6e0; --ink: #3a3631; --soft: #6f695f; --line: #d3cec4; --bar: #f4f2ee; --accent: #b4573a; --accent-ink: #fff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #1c1b19; --ink: #e6e1d8; --soft: #a39d92; --line: #3a3732; --bar: #242220; --accent: #d9794f; --accent-ink: #1c1b19; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--ground); color: var(--ink); font: 15px/1.7 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  .box { width: 100%; max-width: 420px; background: var(--bar); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0; color: var(--soft); }
  a { display: inline-block; margin-top: 20px; padding: 10px 20px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<div class="box">
  <h1>找不到这个页面</h1>
  <p>地址可能输错了，或者这个页面已经不在了。</p>
  <a href="/">回到首页</a>
</div>
</body>
</html>
