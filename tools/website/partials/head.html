<script>
// Theme: 跟随系统 → 浅色 → 深色, kept in localStorage and set on <html> before the page paints.
(function () {
  var root = document.documentElement, key = "clipboxx-site-theme", names = { light: "浅色", dark: "深色" };
  function read() { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function apply(theme) {
    if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme); else root.removeAttribute("data-theme");
    var label = "主题：" + (names[theme] || "跟随系统") + "，点一下切换";
    document.querySelectorAll("[data-theme-toggle]").forEach(function (b) { b.setAttribute("aria-label", label); b.title = label; });
  }
  apply(read());
  document.addEventListener("DOMContentLoaded", function () { apply(read()); });
  document.addEventListener("click", function (event) {
    if (!event.target.closest || !event.target.closest("[data-theme-toggle]")) return;
    var now = root.getAttribute("data-theme"), next = now === "light" ? "dark" : now === "dark" ? "" : "light";
    try { if (next) localStorage.setItem(key, next); else localStorage.removeItem(key); } catch (e) {}
    apply(next);
  });
  // The header shows a hairline only once the page has scrolled.
  function scrolled() { root.classList.toggle("scrolled", window.scrollY > 4); }
  window.addEventListener("scroll", scrolled, { passive: true });
  document.addEventListener("DOMContentLoaded", scrolled);
})();
</script>
