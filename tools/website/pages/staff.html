<div class="solo">
  <form class="card solo-card staff-form" id="staff-form" method="post" action="/staff/verify">
    <h1>Copyboxx 内部版</h1>
    <p>输入公司发的密码，验证通过后才能下载。</p>
    <label class="staff-label">密码<input name="password" type="password" required autocomplete="current-password"></label>
    <p class="staff-error" id="wrong">密码不对，请再试一次。</p>
    <p class="staff-error" id="limit">试的次数太多了，请一小时后再试。</p>
    <button class="pill staff-verify" type="submit"><span class="staff-spinner" aria-hidden="true"></span><span class="staff-verify-text">验证</span></button>
  </form>
  <div class="card solo-card staff-ready" id="ok">
    <p class="staff-pass"><svg class="staff-check" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11"/><path d="M6.5 12.5l3.5 3.5 7.5-8"/></svg>验证通过</p>
    <h1>Copyboxx 内部版</h1>
    <p>Windows 10 / 11（64 位）和 Mac（Apple 芯片）</p>
    <p class="small">版本 <span id="staff-version"></span> · 12 小时内不用再验证</p>
    <div class="staff-buttons">
      <a class="pill" href="/staff/file/win">下载 Windows 版 →</a>
      <a class="pill" href="/staff/file/mac">下载 Mac 版 →</a>
    </div>
    <p class="small staff-notes">Windows：下载后双击运行，提示「未知发布者」时点「更多信息」再点「仍要运行」。Mac：解压后把 Copyboxx 拖进「应用程序」，第一次被拦下时到「系统设置 → 隐私与安全性」点「仍要打开」。装好以后软件会自己更新。</p>
  </div>
</div>

<script>
// 点「验证」后按钮转圈并显示「验证中…」，直到服务器回来：通过就换成下载卡，不对就显示红字。没有脚本也能用。
document.getElementById("staff-form").addEventListener("submit", function () {
  var button = this.querySelector(".staff-verify");
  button.classList.add("is-busy");
  button.querySelector(".staff-verify-text").textContent = "验证中…";
});
</script>
