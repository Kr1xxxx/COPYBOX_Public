<title>Copyboxx 测试版</title>
<style>
  :root {
    --ground: #e9e6e0; --ink: #3a3631; --soft: #7d776d; --line: #d3cec4; --bar: #f4f2ee;
    --chrome: #f3f1ed; --chrome-line: #d8d3ca; --accent: #b4573a; --accent-ink: #fff;
    --shadow: 0 1px 2px rgba(40,34,26,.12), 0 18px 48px rgba(40,34,26,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #1c1b19; --ink: #e6e1d8; --soft: #8c867b; --line: #3a3732; --bar: #242220;
      --chrome: #2a2825; --chrome-line: #3d3a35; --accent: #d9794f; --accent-ink: #1c1b19;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 18px 48px rgba(0,0,0,.55); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #1c1b19; --ink: #e6e1d8; --soft: #8c867b; --line: #3a3732; --bar: #242220;
    --chrome: #2a2825; --chrome-line: #3d3a35; --accent: #d9794f; --accent-ink: #1c1b19;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 18px 48px rgba(0,0,0,.55); color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .page { min-height: 100%; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding: 10px 16px; background: var(--bar); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand b { font-size: 15px; letter-spacing: .02em; }
  .brand span { color: var(--soft); font-size: 12.5px; }
  .brand .ver-time { font-variant-numeric: tabular-nums; }
  .brand .ver { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--ground); border: 1px solid var(--line); }
  .seg button { all: unset; box-sizing: border-box; cursor: pointer; padding: 5px 18px; border-radius: 7px; font-size: 13px; color: var(--soft); }
  .seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .seg button:focus-visible, .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tool { cursor: pointer; font: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .tool:disabled { opacity: .55; cursor: default; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; min-width: 250px; padding: 6px; border-radius: 10px; background: var(--bar); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .menu[hidden] { display: none; }
  .menu button { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; padding: 7px 10px; border-radius: 7px; font-size: 13px; color: var(--ink); }
  .menu button small { display: block; color: var(--soft); font-size: 11.5px; }
  .menu button:hover, .menu button:focus-visible { background: var(--ground); }
  .layout { flex: 1; display: flex; align-items: stretch; min-height: 0; }
  .log { flex: 0 0 260px; box-sizing: border-box; padding: 16px 14px 24px 16px; border-right: 1px solid var(--line); background: var(--bar); overflow-y: auto; max-height: calc(100vh - 53px); position: sticky; top: 0; align-self: flex-start; }
  .log h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; color: var(--soft); font-weight: 600; }
  .log ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .log li b { display: inline-block; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink); }
  .log li.current b { color: var(--accent); }
  .log li small { margin-left: 6px; color: var(--soft); font-size: 11.5px; }
  .log li .tag { margin-left: 6px; padding: 0 6px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 11px; }
  .log ul { margin: 4px 0 0; padding-left: 16px; color: var(--soft); font-size: 12.5px; line-height: 1.5; }
  .log ul li { margin: 2px 0; }
  .log .empty { color: var(--soft); font-size: 12.5px; }
  .layout .stage { min-width: 0; }
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .log { flex: none; max-height: 220px; position: static; width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
  }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px 16px; }
  .scroller { max-width: 100%; overflow-x: auto; padding: 4px 10px 22px; }
  .window { --w: 680px; --h: 620px; width: var(--w); transition: width .22s ease; border-radius: 8px; background: var(--chrome); box-shadow: var(--shadow); border: 1px solid var(--chrome-line); overflow: hidden; }
  .window[data-mode="mini"] { --w: 360px; --h: 440px; }
  .window { position: relative; }
  .window[data-os="mac"] { border-radius: 12px; }
  .lights { display: none; position: absolute; left: 14px; top: 14px; gap: 8px; pointer-events: none; z-index: 2; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.14); }
  .lights i:nth-child(2) { background: #febc2e; }
  .lights i:nth-child(3) { background: #28c840; }
  .window[data-os="mac"] .lights { display: flex; }
  .window[data-os="mac"] .titlebar { display: none; }
  .titlebar { display: flex; align-items: center; justify-content: space-between; height: 32px; padding-left: 12px; font-size: 12px; border-bottom: 1px solid var(--chrome-line); user-select: none; }
  .titlebar b { font-weight: 600; letter-spacing: .02em; }
  .controls { display: flex; height: 100%; }
  .controls i { width: 44px; display: grid; place-items: center; font-style: normal; color: var(--soft); font-size: 13px; }
  .window iframe { display: block; width: var(--w); height: var(--h); transition: width .22s ease, height .22s ease; border: 0; background: #faf9f6; }
  .note { margin: 0; max-width: 680px; text-align: center; color: var(--soft); font-size: 12.5px; text-wrap: balance; }
  .note a { color: var(--accent); }
  .busy { position: fixed; inset: auto 0 18px 0; display: flex; justify-content: center; pointer-events: none; }
  .busy[hidden] { display: none; }
  .busy span { background: rgba(31,30,28,.92); color: #fff; padding: 8px 16px; border-radius: 18px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
</style>
<div class="page">
  <header class="topbar">
    <div class="brand"><b>Copyboxx</b><span class="ver" title="网页测试版的版本号">v__VERSION__</span><span class="ver-time" data-at="__UPDATED_ISO__" title="这个版本的更新时间（你的本地时间）">__UPDATED__</span><span>网页测试版 · 软件窗口之外是预览工具</span></div>
    <div class="seg" role="radiogroup" aria-label="软件版本">
      <button type="button" role="radio" aria-checked="true" data-os="win">Windows 版</button>
      <button type="button" role="radio" aria-checked="false" data-os="mac">Mac 版</button>
    </div>
    <div class="tools">
      <div class="menu-wrap">
        <button type="button" class="tool" id="snippetsBtn" aria-haspopup="menu" aria-expanded="false">导入测试话术 ▾</button>
        <div class="menu" id="snippetsMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-file="samples/1-inquiry-quote.csv">第 1 组 · 询盘与报价<small>11 条：问候、报价、付款</small></button>
          <button type="button" role="menuitem" data-file="samples/2-sample-custom-shipping.csv">第 2 组 · 样品、定制、物流<small>11 条：样品、Logo 定制、运费单号</small></button>
          <button type="button" role="menuitem" data-file="samples/3-followup-aftersales.csv">第 3 组 · 跟进与售后<small>10 条：回访、促销、破损、退款</small></button>
          <button type="button" role="menuitem" data-file="samples/4-full-test-sheet.csv">第 4 组 · 完整测试表<small>37 行，含 2 行错误和 1 条重复</small></button>
        </div>
      </div>
      <div class="menu-wrap">
        <button type="button" class="tool" id="noticeBtn" aria-haspopup="menu" aria-expanded="false">看更新通知 ▾</button>
        <div class="menu" id="noticeMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-kind="app">软件更新后<small>「Copyboxx 已更新」，示例文字</small></button>
          <button type="button" role="menuitem" data-kind="content">公司推送话术后<small>「公司话术有更新」，不用更新软件</small></button>
        </div>
      </div>
      <button type="button" class="tool" id="reseed">补齐 10 张测试图</button>
    </div>
  </header>
  <div class="layout">
  <aside class="log" aria-label="版本更新">
    <h2>版本更新</h2>
    <ol id="logList"><li class="empty">正在读取…</li></ol>
  </aside>
  <main class="stage">
    <div class="scroller">
      <div class="window" id="win" data-mode="full" data-os="win">
        <div class="titlebar"><b>Copyboxx</b><span class="controls" aria-hidden="true"><i>&#8212;</i><i>&#9633;</i><i>&#10005;</i></span></div>
        <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
      <iframe id="app" src="app-win.html" title="Copyboxx" allow="clipboard-write; clipboard-read"></iframe>
      </div>
    </div>
    <p class="note" id="note"></p>
  </main>
  </div>
</div>
<div class="busy" id="busy" hidden><span id="busyText"></span></div>
<script>
// The update time in the viewer's own clock, and how long ago it was; refreshed while the page stays open.
(function () {
  var el = document.querySelector(".ver-time");
  var at = el && new Date(el.getAttribute("data-at"));
  if (!el || !at || isNaN(at.getTime())) return;
  function two(n) { return (n < 10 ? "0" : "") + n; }
  function paint() {
    var now = new Date();
    var sameDay = at.toDateString() === now.toDateString();
    var clock = two(at.getHours()) + ":" + two(at.getMinutes());
    var day = sameDay ? "" : two(at.getMonth() + 1) + "-" + two(at.getDate()) + " ";
    var mins = Math.max(0, Math.floor((now - at) / 60000));
    var ago = mins < 1 ? "刚刚" : mins < 60 ? mins + " 分钟前" : mins < 1440 ? Math.floor(mins / 60) + " 小时前" : Math.floor(mins / 1440) + " 天前";
    el.textContent = day + clock + " 更新 · " + ago;
  }
  paint();
  setInterval(paint, 20000);
})();
</script>
<script type="module">
import { seedTestImages } from "./seed.js";
const win = document.getElementById("win"), frame = document.getElementById("app"), note = document.getElementById("note");
const busy = document.getElementById("busy"), busyText = document.getElementById("busyText"), reseed = document.getElementById("reseed");
const SEEDED = "clipbox-preview:seeded:v1", OS = "clipbox-preview:os";
let mode = "full", os = "win", seeding = false;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* optional */ } } };

function renderNote() {
  const label = os === "mac" ? "Mac 版" : "Windows 版";
  const size = mode === "mini" ? "迷你窗口 360 × 440（真软件里它会置顶）" : "软件最小窗口 680 × 620，这里就是实际尺寸";
  note.innerHTML = `${label} · ${size}。数据只存在你这个浏览器里，不会上传。 <a href="app-${os}.html" target="_blank" rel="noopener">在新标签页打开</a>`;
}
function show(text) { busyText.textContent = text; busy.hidden = !text; }

function setOs(next, reload = true) {
  os = next; win.dataset.os = next; mode = "full"; win.dataset.mode = "full";
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.os === next)));
  store.set(OS, next); renderNote();
  if (reload) frame.src = `app-${next}.html`;
}
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => { if (b.dataset.os !== os) setOs(b.dataset.os); }));

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.clipbox !== "window-mode") return;
  mode = data.mode === "mini" ? "mini" : "full"; win.dataset.mode = mode; renderNote();
});

function appReady() {
  return new Promise((resolve) => {
    const started = Date.now();
    const timer = setInterval(() => {
      try { const d = frame.contentDocument; if (d && d.querySelector(".app-shell") && frame.contentWindow.localStorage.getItem("clipbox.device-key.v1")) { clearInterval(timer); resolve(frame.contentWindow); } } catch { /* not loaded yet */ }
      if (Date.now() - started > 20000) { clearInterval(timer); resolve(null); }
    }, 150);
  });
}
function reloadFrame() { return new Promise((resolve) => { frame.addEventListener("load", () => resolve(), { once: true }); frame.contentWindow.location.reload(); }); }
async function openImages() {
  for (let i = 0; i < 20; i += 1) {
    try {
      const d = frame.contentDocument; const tab = d && [...d.querySelectorAll(".kind-switch button")].find((x) => x.textContent.trim() === "图片");
      if (tab && tab.getAttribute("aria-pressed") === "true") return;
      if (tab) tab.click();
    } catch { /* frame still loading */ }
    await new Promise((resolve) => setTimeout(resolve, 400));
  }
}

async function seed(manual) {
  if (seeding) return; seeding = true; reseed.disabled = true;
  try {
    const w = await appReady(); if (!w) return;
    const deviceKey = w.localStorage.getItem("clipbox.device-key.v1");
    const added = await seedTestImages(deviceKey, (n, total, title) => show(`正在放入测试图 ${n} / ${total}：${title}`));
    show("");
    store.set(SEEDED, "1");
    if (added > 0) {
      // The 图片 page reads the store when it is first opened, so the first run needs no reload; a later top-up does.
      if (manual) { show("刷新软件…"); await Promise.race([reloadFrame(), new Promise((resolve) => setTimeout(resolve, 4000))]); await appReady(); }
      await openImages(); show("");
    }
    else if (manual) { show("10 张测试图都在了"); setTimeout(() => show(""), 1600); }
  } catch (error) { show("放入测试图失败：" + (error && error.message ? error.message : "未知原因")); setTimeout(() => show(""), 4000); }
  finally { seeding = false; reseed.disabled = false; }
}
reseed.addEventListener("click", () => seed(true));

// Test snippets: opens the app's own import dialog with a sample sheet, so the real import flow is what you see.
const snippetsBtn = document.getElementById("snippetsBtn"), snippetsMenu = document.getElementById("snippetsMenu");
function setMenu(open) { snippetsMenu.hidden = !open; snippetsBtn.setAttribute("aria-expanded", String(open)); }
snippetsBtn.addEventListener("click", (event) => { event.stopPropagation(); setMenu(snippetsMenu.hidden); });
document.addEventListener("click", (event) => { if (!snippetsMenu.contains(event.target)) setMenu(false); });
document.addEventListener("keydown", (event) => { if (event.key === "Escape") setMenu(false); });
async function openSnippets(d) {
  for (let i = 0; i < 20; i += 1) {
    const tab = [...d.querySelectorAll(".kind-switch button")].find((x) => x.textContent.trim() === "话术");
    if (!tab || tab.getAttribute("aria-pressed") === "true") return;
    tab.click(); await new Promise((resolve) => setTimeout(resolve, 200));
  }
}
async function importSnippets(file, title) {
  setMenu(false); snippetsBtn.disabled = true;
  try {
    show("正在打开导入窗口…");
    if (mode === "mini") { frame.src = `app-${os}.html`; mode = "full"; win.dataset.mode = "full"; renderNote(); await new Promise((resolve) => setTimeout(resolve, 300)); }
    const w = await appReady(); if (!w) throw new Error("软件还没加载好");
    const d = w.document; await openSnippets(d);
    const input = [...d.querySelectorAll("input[type=file]")].find((x) => (x.accept || "").includes(".csv"));
    if (!input) throw new Error("找不到导入入口");
    const response = await fetch(file); if (!response.ok) throw new Error("读取测试表格失败");
    const blob = await response.blob();
    const transfer = new w.DataTransfer();
    transfer.items.add(new w.File([blob], `${title}.csv`, { type: "text/csv" }));
    input.files = transfer.files;
    input.dispatchEvent(new w.Event("change", { bubbles: true }));
    show("");
  } catch (error) { show("打开导入窗口失败：" + (error && error.message ? error.message : "未知原因")); setTimeout(() => show(""), 4000); }
  finally { snippetsBtn.disabled = false; }
}
snippetsMenu.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => importSnippets(b.dataset.file, b.firstChild.textContent.trim())));

setOs(store.get(OS) === "mac" ? "mac" : "win", store.get(OS) === "mac");
// Version log on the left: tools/preview/changelog.json, newest first. Whoever bumps VERSION adds the entry there.
(async function renderLog() {
  const list = document.getElementById("logList");
  try {
    const response = await fetch("changelog.json", { cache: "no-store" }); if (!response.ok) throw new Error("no log");
    const entries = await response.json();
    list.textContent = "";
    entries.forEach((entry, index) => {
      const li = document.createElement("li"); if (index === 0) li.className = "current";
      const head = document.createElement("div");
      const v = document.createElement("b"); v.textContent = "v" + entry.version; head.append(v);
      if (index === 0) { const t = document.createElement("span"); t.className = "tag"; t.textContent = "当前"; head.append(t); }
      if (entry.date) { const d = document.createElement("small"); d.textContent = entry.date; head.append(d); }
      const ul = document.createElement("ul");
      (entry.items || []).forEach((text) => { const item = document.createElement("li"); item.textContent = text; ul.append(item); });
      li.append(head, ul); list.append(li);
    });
  } catch { list.innerHTML = '<li class="empty">暂时读不到更新记录</li>'; }
})();

// 更新通知 (D-071): shows the app's real card with sample lines; nothing is stored, so it can be shown again.
const noticeBtn = document.getElementById("noticeBtn");
const noticeMenu = document.getElementById("noticeMenu");
const NOTICE_SAMPLES = {
  app: { kind: "app", items: ["新增：话术可以一键分享给同事", "设置 → 数据 可以直接导入公司发来的 Tips 文件"] },
  content: { kind: "content", items: ["新增 12 条话术", "新增 5 条 Tips"] },
};
function setNoticeMenu(open) { noticeMenu.hidden = !open; noticeBtn.setAttribute("aria-expanded", String(open)); }
noticeBtn.addEventListener("click", (event) => { event.stopPropagation(); setNoticeMenu(noticeMenu.hidden); });
document.addEventListener("click", (event) => { if (!noticeMenu.contains(event.target)) setNoticeMenu(false); });
document.addEventListener("keydown", (event) => { if (event.key === "Escape") setNoticeMenu(false); });
noticeMenu.querySelectorAll("button").forEach((b) => b.addEventListener("click", async () => {
  setNoticeMenu(false);
  if (mode === "mini") { frame.src = `app-${os}.html`; mode = "full"; win.dataset.mode = "full"; renderNote(); await new Promise((resolve) => setTimeout(resolve, 300)); }
  const w = await appReady(); if (!w) return;
  w.dispatchEvent(new w.CustomEvent("clipbox:whats-new", { detail: NOTICE_SAMPLES[b.dataset.kind] }));
}));

// Nothing is added on open (owner, 2026-10-14: no automatic demo); 补齐 10 张测试图 and 导入测试话术 add test data by hand.
</script>
